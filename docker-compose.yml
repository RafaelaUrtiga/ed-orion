# Sobe o pipeline completo: armazenamento (MinIO), bancos (PostgreSQL e Qdrant) e a API.
# As credenciais vêm do arquivo .env (copie o .env.example e preencha).
services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  app:
    build: .
    container_name: app
    depends_on:
      - minio
      - postgres
      - qdrant
    ports:
      - "8000:8000"
    environment:
      MINIO_HOST: minio:9000
      MINIO_KEY: ${MINIO_KEY}
      MINIO_SECRET: ${MINIO_SECRET}
      MINIO_BUCKET: ${MINIO_BUCKET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      # Cache do modelo BGE-M3, para não baixar de novo a cada subida
      - hf-cache:/root/.cache/huggingface

volumes:
  minio-data:
  postgres-data:
  qdrant-data:
  hf-cache:
